<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Illustration: a recipe discovery web app with search, a grid of recipe cards and a detail panel">
  <defs>
    <linearGradient id="rrBG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f0d"/>
      <stop offset=".5" stop-color="#101814"/>
      <stop offset="1" stop-color="#0a0f0c"/>
    </linearGradient>
    <linearGradient id="rrCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152019"/>
      <stop offset="1" stop-color="#101915"/>
    </linearGradient>
    <linearGradient id="rrAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb03a"/>
      <stop offset="1" stop-color="#a0f669"/>
    </linearGradient>
    <radialGradient id="rrGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a0f669" stop-opacity=".12"/>
      <stop offset="1" stop-color="#a0f669" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rrGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <symbol id="rrLeaf" viewBox="0 0 24 24">
      <path d="M4 20c0-8 5-14 16-16-1 11-7 16-16 16z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="750" fill="url(#rrBG)"/>
  <rect width="1200" height="750" fill="url(#rrGrid)"/>
  <ellipse cx="600" cy="330" rx="520" ry="320" fill="url(#rrGlow)"/>

  <!-- browser frame -->
  <g transform="translate(70 66)">
    <rect width="1060" height="618" rx="18" fill="#0b120e" stroke="#ffffff" stroke-opacity=".13"/>
    <!-- chrome bar -->
    <g>
      <rect width="1060" height="52" rx="18" fill="#121b16"/>
      <rect y="34" width="1060" height="18" fill="#121b16"/>
      <circle cx="30" cy="26" r="5.5" fill="#ff5f57" fill-opacity=".75"/>
      <circle cx="50" cy="26" r="5.5" fill="#febc2e" fill-opacity=".75"/>
      <circle cx="70" cy="26" r="5.5" fill="#28c840" fill-opacity=".75"/>
      <rect x="98" y="14" width="420" height="24" rx="12" fill="#0c1410" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="114" y="31" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#5f7a6b">reactrecipe.app</text>
    </g>

    <!-- search bar -->
    <g transform="translate(40 86)">
      <rect width="520" height="46" rx="23" fill="#101a15" stroke="#a0f669" stroke-opacity=".3"/>
      <g transform="translate(20 15)" stroke="#a0f669" stroke-width="1.8" fill="none">
        <circle cx="7" cy="7" r="6.5"/>
        <path d="M12 12l6 6"/>
      </g>
      <rect x="48" y="19" width="180" height="8" rx="4" fill="#4d6356"/>
      <rect x="48" y="19" width="76" height="8" rx="4" fill="#a0f669" fill-opacity=".45"/>
      <rect x="404" y="10" width="98" height="26" rx="13" fill="#a0f669" fill-opacity=".16" stroke="#a0f669" stroke-opacity=".35"/>
      <text x="453" y="27" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.2" fill="#a0f669">SEARCH</text>
    </g>

    <!-- filter chips -->
    <g transform="translate(40 152)" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.2" fill="#7d9488">
      <g><rect width="76" height="26" rx="13" fill="#a0f669" fill-opacity=".14" stroke="#a0f669" stroke-opacity=".4"/><text x="38" y="17" text-anchor="middle" fill="#a0f669">ALL</text></g>
      <g transform="translate(88 0)"><rect width="86" height="26" rx="13" fill="#101a15" stroke="#ffffff" stroke-opacity=".1"/><text x="43" y="17" text-anchor="middle">VEGAN</text></g>
      <g transform="translate(186 0)"><rect width="112" height="26" rx="13" fill="#101a15" stroke="#ffffff" stroke-opacity=".1"/><text x="56" y="17" text-anchor="middle">UNDER 30M</text></g>
      <g transform="translate(310 0)"><rect width="94" height="26" rx="13" fill="#101a15" stroke="#ffffff" stroke-opacity=".1"/><text x="47" y="17" text-anchor="middle">DESSERT</text></g>
    </g>

    <!-- recipe card grid -->
    <g transform="translate(40 202)">
      <!-- card 1 -->
      <g>
        <rect width="228" height="268" rx="14" fill="url(#rrCard)" stroke="#ffffff" stroke-opacity=".1"/>
        <rect x="14" y="14" width="200" height="122" rx="9" fill="#16241c"/>
        <!-- bowl motif -->
        <g transform="translate(100 76)">
          <path d="M-46 6a46 26 0 0 0 92 0z" fill="#a0f669" fill-opacity=".2" stroke="#a0f669" stroke-opacity=".45"/>
          <path d="M-30 2c6-16 20-20 30-16 10-4 24 0 30 16" fill="none" stroke="#ffb03a" stroke-opacity=".6" stroke-width="1.6"/>
          <circle cx="-10" cy="-4" r="4" fill="#ffb03a" fill-opacity=".55"/>
          <circle cx="12" cy="-8" r="3" fill="#a0f669" fill-opacity=".7"/>
        </g>
        <rect x="14" y="152" width="128" height="9" rx="4.5" fill="#7d9488"/>
        <rect x="14" y="170" width="168" height="7" rx="3.5" fill="#3f5347"/>
        <rect x="14" y="186" width="132" height="7" rx="3.5" fill="#3f5347"/>
        <g transform="translate(14 212)">
          <rect width="62" height="24" rx="12" fill="#a0f669" fill-opacity=".12"/><text x="31" y="16" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#a0f669">25 MIN</text>
          <rect x="72" width="52" height="24" rx="12" fill="#ffffff" fill-opacity=".05"/><text x="98" y="16" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7d9488">4.8★</text>
        </g>
      </g>

      <!-- card 2 (featured) -->
      <g transform="translate(248 0)">
        <rect width="228" height="268" rx="14" fill="url(#rrCard)" stroke="#a0f669" stroke-opacity=".45"/>
        <rect x="14" y="14" width="200" height="122" rx="9" fill="#17261d"/>
        <g transform="translate(100 78)">
          <circle r="34" fill="none" stroke="#a0f669" stroke-opacity=".3" stroke-dasharray="3 6"/>
          <use href="#rrLeaf" x="-16" y="-16" width="32" height="32" color="#a0f669"/>
        </g>
        <rect x="14" y="152" width="150" height="9" rx="4.5" fill="#d3e6da"/>
        <rect x="14" y="170" width="176" height="7" rx="3.5" fill="#3f5347"/>
        <rect x="14" y="186" width="118" height="7" rx="3.5" fill="#3f5347"/>
        <g transform="translate(14 212)">
          <rect width="62" height="24" rx="12" fill="#a0f669" fill-opacity=".18"/><text x="31" y="16" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#a0f669">15 MIN</text>
          <rect x="72" width="52" height="24" rx="12" fill="#ffffff" fill-opacity=".05"/><text x="98" y="16" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7d9488">4.9★</text>
        </g>
      </g>

      <!-- card 3 -->
      <g transform="translate(496 0)">
        <rect width="228" height="268" rx="14" fill="url(#rrCard)" stroke="#ffffff" stroke-opacity=".1"/>
        <rect x="14" y="14" width="200" height="122" rx="9" fill="#16241c"/>
        <g transform="translate(100 78)">
          <circle cx="-16" cy="2" r="22" fill="#ffb03a" fill-opacity=".18" stroke="#ffb03a" stroke-opacity=".45"/>
          <circle cx="18" cy="-6" r="14" fill="#a0f669" fill-opacity=".16" stroke="#a0f669" stroke-opacity=".4"/>
        </g>
        <rect x="14" y="152" width="112" height="9" rx="4.5" fill="#7d9488"/>
        <rect x="14" y="170" width="160" height="7" rx="3.5" fill="#3f5347"/>
        <rect x="14" y="186" width="140" height="7" rx="3.5" fill="#3f5347"/>
        <g transform="translate(14 212)">
          <rect width="62" height="24" rx="12" fill="#a0f669" fill-opacity=".12"/><text x="31" y="16" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#a0f669">40 MIN</text>
          <rect x="72" width="52" height="24" rx="12" fill="#ffffff" fill-opacity=".05"/><text x="98" y="16" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7d9488">4.6★</text>
        </g>
      </g>
    </g>

    <!-- detail panel -->
    <g transform="translate(792 86)">
      <rect width="228" height="484" rx="14" fill="url(#rrCard)" stroke="#ffffff" stroke-opacity=".1"/>
      <rect x="14" y="14" width="200" height="140" rx="9" fill="#16241c"/>
      <g transform="translate(114 84)">
        <circle r="40" fill="#a0f669" fill-opacity=".12"/>
        <use href="#rrLeaf" x="-22" y="-22" width="44" height="44" color="#ffb03a"/>
      </g>
      <text x="14" y="184" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1.4" fill="#a0f669">RECIPE DETAIL</text>
      <rect x="14" y="196" width="146" height="9" rx="4.5" fill="#d3e6da"/>
      <rect x="14" y="218" width="196" height="7" rx="3.5" fill="#3f5347"/>
      <rect x="14" y="234" width="176" height="7" rx="3.5" fill="#3f5347"/>
      <rect x="14" y="250" width="190" height="7" rx="3.5" fill="#3f5347"/>
      <g stroke="#ffffff" stroke-opacity=".07">
        <path d="M14 282h200"/>
        <path d="M14 348h200"/>
      </g>
      <text x="14" y="306" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1.4" fill="#7d9488">INGREDIENTS</text>
      <g fill="#4d6356">
        <circle cx="18" cy="322" r="3" fill="#a0f669" fill-opacity=".6"/><rect x="30" y="318" width="120" height="7" rx="3.5"/>
        <circle cx="18" cy="338" r="3" fill="#a0f669" fill-opacity=".6"/><rect x="30" y="334" width="150" height="7" rx="3.5"/>
      </g>
      <text x="14" y="372" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1.4" fill="#7d9488">STEPS</text>
      <g fill="#4d6356">
        <circle cx="18" cy="390" r="3" fill="#ffb03a" fill-opacity=".6"/><rect x="30" y="386" width="166" height="7" rx="3.5"/>
        <circle cx="18" cy="408" r="3" fill="#ffb03a" fill-opacity=".6"/><rect x="30" y="404" width="132" height="7" rx="3.5"/>
        <circle cx="18" cy="426" r="3" fill="#ffb03a" fill-opacity=".6"/><rect x="30" y="422" width="152" height="7" rx="3.5"/>
      </g>
      <rect x="14" y="450" width="200" height="24" rx="12" fill="url(#rrAccent)" fill-opacity=".18" stroke="#a0f669" stroke-opacity=".3"/>
    </g>
  </g>

  <g stroke="#ffb03a" stroke-opacity=".35" stroke-width="2">
    <path d="M46 46h20M46 46v20"/>
    <path d="M1154 704h-20M1154 704v-20"/>
  </g>
</svg>
