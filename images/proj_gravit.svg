<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Illustration: a graph of documents linked to figures, retrieved by a graph network and passed to a vision-language model to answer a question">
  <defs>
    <linearGradient id="gvBG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset=".5" stop-color="#0e1720"/>
      <stop offset="1" stop-color="#0a1017"/>
    </linearGradient>
    <linearGradient id="gvEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6cd4ff"/>
      <stop offset="1" stop-color="#ffb03a"/>
    </linearGradient>
    <radialGradient id="gvGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6cd4ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6cd4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gvGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#gvBG)"/>
  <rect width="1200" height="750" fill="url(#gvGrid)"/>
  <ellipse cx="370" cy="340" rx="420" ry="330" fill="url(#gvGlow)"/>

  <!-- ============ LEFT: document graph ============ -->
  <g transform="translate(60 90)">
    <text x="0" y="0" font-family="'JetBrains Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#7f97a6">DOCUMENT GRAPH</text>

    <!-- edges -->
    <g stroke="url(#gvEdge)" stroke-width="1.5" stroke-opacity=".55" fill="none">
      <path d="M150 140 L196 268"/>
      <path d="M150 140 L338 126"/>
      <path d="M196 268 L338 300"/>
      <path d="M338 126 L196 268"/>
      <path d="M338 126 L468 208"/>
      <path d="M338 300 L468 208"/>
      <path d="M196 268 L138 372"/>
      <path d="M338 300 L262 400"/>
      <path d="M468 208 L432 344"/>
    </g>

    <!-- paper node (larger) -->
    <g transform="translate(150 140)">
      <rect x="-58" y="-42" width="116" height="84" rx="10" fill="#101c25" stroke="#6cd4ff" stroke-opacity=".5"/>
      <g fill="#4f6b7a">
        <rect x="-40" y="-24" width="80" height="5" rx="2.5"/>
        <rect x="-40" y="-11" width="62" height="5" rx="2.5"/>
        <rect x="-40" y="2" width="74" height="5" rx="2.5"/>
        <rect x="-40" y="15" width="46" height="5" rx="2.5"/>
      </g>
      <rect x="-40" y="29" width="34" height="5" rx="2.5" fill="#ffb03a" fill-opacity=".8"/>
    </g>

    <!-- figure node -->
    <g transform="translate(338 126)">
      <rect x="-34" y="-30" width="68" height="60" rx="8" fill="#121e27" stroke="#ffb03a" stroke-opacity=".55"/>
      <image href="" width="0" height="0"/>
      <path d="M-22 18l13-15 10 11 8-9 13 13z" fill="#ffb03a" fill-opacity=".55"/>
      <circle cx="-14" cy="-12" r="4" fill="#ffc464" fill-opacity=".8"/>
    </g>

    <!-- small nodes -->
    <g fill="#101c25" stroke="#6cd4ff" stroke-opacity=".34">
      <circle cx="196" cy="268" r="17"/>
      <circle cx="468" cy="208" r="21"/>
      <circle cx="138" cy="372" r="14"/>
      <circle cx="262" cy="400" r="15"/>
      <circle cx="432" cy="344" r="13"/>
      <circle cx="70" cy="270" r="11"/>
    </g>
    <g fill="#7f97a6">
      <circle cx="196" cy="268" r="5"/>
      <circle cx="468" cy="208" r="6"/>
      <circle cx="138" cy="372" r="4"/>
      <circle cx="262" cy="400" r="4.5"/>
      <circle cx="432" cy="344" r="4"/>
      <circle cx="70" cy="270" r="3.5"/>
    </g>

    <g stroke="#ffffff" stroke-opacity=".10" fill="none">
      <path d="M70 270 L196 268"/>
      <path d="M262 400 L338 300"/>
    </g>
  </g>

  <!-- ============ MIDDLE: retrieval arrow ============ -->
  <g transform="translate(556 330)">
    <rect x="-46" y="-13" width="92" height="26" rx="13" fill="#101a22" stroke="#6cd4ff" stroke-opacity=".3"/>
    <text x="0" y="4.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" letter-spacing="1.6" fill="#9fc4d4">RETRIEVE</text>
    <path d="M52 0h40" stroke="#ffb03a" stroke-opacity=".55" stroke-width="1.6"/>
    <path d="M86 -6l12 6-12 6" fill="none" stroke="#ffb03a" stroke-opacity=".7" stroke-width="1.6"/>
  </g>

  <!-- ============ RIGHT: fused evidence → VLM ============ -->
  <g transform="translate(692 92)">
    <rect width="448" height="566" rx="16" fill="#0a1219" stroke="#ffffff" stroke-opacity=".12"/>
    <rect width="448" height="566" rx="16" fill="url(#gvGrid)"/>
    <text x="22" y="30" font-family="'JetBrains Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#7f97a6">GRAPH + VISION FUSION</text>

    <!-- text evidence -->
    <g transform="translate(22 62)">
      <rect width="190" height="150" rx="10" fill="#101c25" stroke="#6cd4ff" stroke-opacity=".3"/>
      <text x="14" y="24" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1.6" fill="#6cd4ff">TEXT</text>
      <g fill="#4f6b7a">
        <rect x="14" y="40" width="150" height="6" rx="3"/>
        <rect x="14" y="56" width="162" height="6" rx="3"/>
        <rect x="14" y="72" width="124" height="6" rx="3"/>
        <rect x="14" y="88" width="144" height="6" rx="3"/>
        <rect x="14" y="104" width="92" height="6" rx="3"/>
      </g>
      <rect x="14" y="122" width="66" height="6" rx="3" fill="#6cd4ff" fill-opacity=".7"/>
    </g>

    <!-- visual evidence -->
    <g transform="translate(232 62)">
      <rect width="194" height="150" rx="10" fill="#101c25" stroke="#ffb03a" stroke-opacity=".35"/>
      <text x="14" y="24" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1.6" fill="#ffb03a">VISION</text>
      <g transform="translate(14 36)">
        <rect width="166" height="66" rx="6" fill="#0d161d" stroke="#ffffff" stroke-opacity=".08"/>
        <path d="M0 58l38-34 26 22 22-18 38 30z" fill="#ffb03a" fill-opacity=".28"/>
        <circle cx="126" cy="20" r="7" fill="#ffc464" fill-opacity=".6"/>
        <rect x="88" y="42" width="60" height="16" rx="3" fill="#6cd4ff" fill-opacity=".18" stroke="#6cd4ff" stroke-opacity=".5"/>
      </g>
      <g transform="translate(14 112)">
        <rect width="80" height="5" rx="2.5" fill="#4f6b7a"/>
        <rect y="13" width="58" height="5" rx="2.5" fill="#3a525f"/>
      </g>
    </g>

    <!-- fusion lines -->
    <g stroke="#ffffff" stroke-opacity=".16" stroke-width="1.3" fill="none">
      <path d="M117 212v26h107v24"/>
      <path d="M329 212v26H224v24"/>
    </g>

    <!-- VLM bar -->
    <g transform="translate(22 286)">
      <rect width="404" height="70" rx="12" fill="#121e27" stroke="url(#gvEdge)" stroke-opacity=".45"/>
      <text x="18" y="30" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#cfe6f1">GRAPH-ENHANCED RETRIEVAL</text>
      <text x="18" y="50" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1.4" fill="#6f8b9a">GNN + VISION-LANGUAGE MODEL</text>
      <g transform="translate(352 24)">
        <circle r="11" fill="#6cd4ff" fill-opacity=".18"/>
        <circle r="4" fill="#6cd4ff"/>
      </g>
    </g>

    <!-- answer -->
    <g transform="translate(22 378)">
      <rect width="404" height="150" rx="12" fill="#0d161d" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="18" y="28" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1.6" fill="#7f97a6">ANSWER</text>
      <g fill="#8fa3ad">
        <rect x="18" y="46" width="330" height="7" rx="3.5"/>
        <rect x="18" y="64" width="360" height="7" rx="3.5" fill-opacity=".85"/>
        <rect x="18" y="82" width="300" height="7" rx="3.5" fill-opacity=".7"/>
        <rect x="18" y="100" width="352" height="7" rx="3.5" fill-opacity=".55"/>
      </g>
      <rect x="18" y="122" width="96" height="7" rx="3.5" fill="#ffb03a" fill-opacity=".65"/>
    </g>
  </g>

  <g stroke="#ffb03a" stroke-opacity=".35" stroke-width="2">
    <path d="M52 52h22M52 52v22"/>
    <path d="M1148 698h-22M1148 698v-22"/>
  </g>
</svg>
